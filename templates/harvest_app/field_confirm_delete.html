{% extends "base.html" %}

{% block content %}
  <h1>Deleting field</h1>
  <form action="" method="post">
    {% csrf_token %}
    <h3>Are you sure you want to delete {{ field.name }}?</h3>
    <button type="submit" class="btn btn-primary">Yes, delete</button>
    <a href="{% url "harvest_app:field-list" %}" class="btn btn-secondary">Cancel</a>

  </form>
{% endblock %}
