{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>
    {% if field %}
      Update field
    {% else %}
      Create field
    {% endif %}
  </h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url "harvest_app:field-list" %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
