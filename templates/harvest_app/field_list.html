{% extends "base.html" %}

{% block content %}
  <div>
    {% if field_list %}
      <ul>
        {% for field in field_list %}
          <li>{{ field.name }}</li>
          <li>{{ field.area }} ha</li>
          <a href="{% url "harvest_app:field-update" field.pk %}">Update</a>
          <a href="{% url "harvest_app:field-delete" field.pk %}">Delete</a>
          <hr>
        {% endfor %}
      </ul>
    {% endif %}
  </div>
{% endblock %}
