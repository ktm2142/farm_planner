{% extends "base.html" %}

{% block content %}
  <div>
    {% if field_list %}
      <ul>
        {% for field in field_list %}
          <li>{{ field.name }}</li>
          <li>{{ field.area }}</li>
          <a href="{% url "harvest_app:field-details" field.pk %}">Details</a>
          <hr>
        {% endfor %}
      </ul>
    {% endif %}
  </div>
{% endblock %}
