{% extends "base.html" %}

{% block content %}
  <div>
    {% if harvest_archive_list %}
      <ul>
        {% for harvest_archive in harvest_archive_list %}
          <li>Start date: {{ harvest_archive.start_date.date }}</li>
          <li>End date: {{ harvest_archive.end_date.date }}</li>
          <a href="{% url "harvest_app:harvest-archive-detail" harvest_archive.pk %}">Details</a>

          <hr>
        {% endfor %}

      </ul>
    {% endif %}
  </div>
{% endblock %}
