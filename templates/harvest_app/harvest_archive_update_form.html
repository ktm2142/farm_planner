{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Updating tons on harvest <strong>from {{ harvest_archive.start_date.date }}
    to {{ harvest_archive.end_date.date }}</strong>
  </h1>

  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Update tons</button>
    <a href="{% url "harvest_app:harvest-archive-detail" harvest_archive.pk %}" class="btn btn-secondary">Cancel</a>
  </form>


{% endblock %}
