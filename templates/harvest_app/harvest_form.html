{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>
    {% if harvest %}
      Update harvest
    {% else %}
      Create harvest
    {% endif %}
  </h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    {% if harvest %}
      <a href="{% url "harvest_app:harvest-detail" harvest.pk %}"
         class="btn btn-secondary">
        Cancel
      </a>
    {% endif %}
  </form>
{% endblock %}
