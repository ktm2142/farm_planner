{% extends "base.html" %}

{% block content %}
  <h1>Deleting vehicle on current harvest</h1>
  <form action="" method="post">
    {% csrf_token %}
    <h3>Are you sure you want to delete {{ harvest_vehicle.vehicle.license_plate }}?</h3>
    <h3>from harvest on {{ harvest_vehicle.harvest.field.name }}?</h3>
    <button type="submit" class="btn btn-primary">Yes, delete</button>
    <a href="{% url "harvest_app:harvest-detail" harvest_vehicle.harvest_id%}" class="btn btn-secondary">Cancel</a>

  </form>
{% endblock %}
