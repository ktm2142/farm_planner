{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>Add vehicle to harvest</h1>
  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    <button type="submit" name="action" value="save_and_add" class="btn btn-secondary">Save and add another</button>
  </form>
{% endblock %}
