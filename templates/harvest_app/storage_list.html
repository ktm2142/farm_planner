{% extends "base.html" %}

{% block content %}
  <div>
    {% if storage_list %}
      <ul>
        {% for storage in storage_list %}
          <li>{{ storage.name }}</li>
          <li>{{ storage.capacity }} tonnes</li>
          <a href="{% url "harvest_app:storage-update" storage.pk %}">Update</a>
          <a href="{% url "harvest_app:storage-delete" storage.pk %}">Delete</a>
          <hr>
        {% endfor %}

      </ul>
    {% endif %}
  </div>
{% endblock %}
