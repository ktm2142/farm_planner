{% extends "base.html" %}

{% block content %}
  <h1>Deleting trailer</h1>
  <form action="" method="post">
    {% csrf_token %}
    <h3>Are you sure you want to delete {{ trailer.get_trailer_type_display }}?</h3>
    <p>License plate: {{ trailer.license_plate }}</p>
    <button type="submit" class="btn btn-primary">Yes, delete</button>
    <a href="{% url "harvest_app:trailer-list" %}" class="btn btn-secondary">Cancel</a>

  </form>
{% endblock %}
