<ul>
  {% if user.is_authenticated %}
    <li>User: {{ user.get_username }}</li>
    <li>
      <form
          action="{% url "logout" %}"
          method="post"
          style="display: inline;"
      >
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
    </li>
  {% else %}
    <li>
      <form
          action="{% url "login" %}"
          methot=post
          style="display: inline;"
      >
        {% csrf_token %}
        <button type="submit">Login</button>
      </form>
    </li>
    <li>
      <form
          action="{% url "registration" %}"
          methot=post
          style="display: inline;"
      >
        {% csrf_token %}
        <button type="submit">Registration</button>
      </form>
    </li>

  {% endif %}
  <li><a href="{% url "harvest_app:harvest-list" %}">Current harvests</a></li>
  <li><a href="{% url "harvest_app:driver-list" %}">Drivers</a></li>
  <li><a href="{% url "harvest_app:vehicle-list" %}">Vehicles</a></li>
  <li><a href="{% url "harvest_app:trailer-list" %}">Trailers</a></li>
  <li><a href="{% url "harvest_app:field-list" %}">Fields</a></li>
  <li><a href="{% url "harvest_app:crop-list" %}">Crops</a></li>
  <li><a href="{% url "harvest_app:harvest-archive-list" %}">Harvest history</a></li>
</ul>
